{% extends "layout.html" %}
{% block title %}
Video Feed
{% endblock %}
{% block content %}

<video id="video" controls="" autoplay="" width="800" height="800"></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<script>
  var video = document.getElementById('video');
  var videoSrc = 'http://192.168.50.62:8887/cam/index.m3u8'; //<- hostname -I 'PI-hostname-ip:8887/cam/index.m3u8' (:8887 HLS port)
  if (Hls.isSupported()) {
    var hls = new Hls();
    hls.loadSource(videoSrc);
    hls.attachMedia(video);
  }

  else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = videoSrc;
  }
</script>

<p>Video site</p>
{% endblock %}
